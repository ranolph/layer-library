name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "22"
          cache: npm
          package-manager-cache: false
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test server and import workflows
        run: python -m pytest -q
      - name: Install viewer build dependencies
        run: npm ci
      - name: Test frontend workflows
        run: npm test
      - name: Rebuild the bundled viewer
        run: |
          npm run build
          git diff --exit-code -- app/static/viewer.bundle.js
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start container
        env:
          LAYER_LIBRARY_BIND: 127.0.0.1
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check HTTP service
        run: |
          curl --fail --silent http://127.0.0.1:8777/api/health
          curl --fail --silent --output /dev/null http://127.0.0.1:8777/
      - name: Show container logs
        if: always()
        run: docker compose logs --no-color --tail=100
      - name: Remove test containers and volumes
        if: always()
        run: docker compose down --volumes

